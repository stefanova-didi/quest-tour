[project]
name = "questtour"
version = "0.1.0"
requires-python = ">=3.12"          # production target is 3.12 (App Service); code must stay 3.12-compatible
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",           # ConfigDict(coerce_numbers_to_str=...) in sync/schema.py
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",      # used directly by the sync-config CLI (also a pydantic-settings dep)
  "python-multipart>=0.0.9",
  "azure-storage-blob>=12.20",
  "azure-identity>=1.17",
  "ruamel.yaml>=0.18",
  "Unidecode>=1.3",
  "tzdata>=2024.1",          # zoneinfo data on Windows
]

[project.scripts]
sync-config = "questtour.cli.sync_config:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["questtour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs TEST_DATABASE_URL pointing at PostgreSQL"]

[tool.ruff]
line-length = 100
