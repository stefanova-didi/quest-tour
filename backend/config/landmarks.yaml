# accepted_answers[0] is the answer shown when a team reveals it.
landmarks:
  - id: lily-pond
    name: Lily Pond
    name_i18n: { de: Seerosenteich, sr: Jezero s lokvanjima }
    coordinates: { lat: 42.68521840568546, lon: 23.3425011626189 }
    task: >-
      Long ago, this place was a swamp. Later, people called it the Fish Pond. Today white
      flowers float on its surface, and in the middle three little boys splash about without
      a care. Around them stand guards who, in fairy tales, wait for a kiss to turn into
      princes. Here, though, no one has kissed them, so they stay at their posts. Find the
      pond, look closely at the figures in the centre and count the ones guarding the
      children. That number is the key to your next step.
    task_i18n:
      de: >-
        Vor langer Zeit war dieser Ort ein Sumpf. Später nannte man ihn den Fischteich.
        Heute treiben weiße Blumen auf seiner Oberfläche, und mitten darin planschen drei
        kleine Jungen sorglos. Um sie herum stehen Wächter, die in Märchen darauf warten,
        durch einen Kuss zu Prinzen zu werden. Doch hier hat sie niemand geküsst, also
        bleiben sie auf ihrem Posten. Finde den Teich, sieh dir die Figuren in der Mitte
        genau an und zähle diejenigen, die die Kinder bewachen. Diese Zahl ist der Schlüssel
        zu deinem nächsten Schritt.
      sr: >-
        Davno je ovo mesto bila močvara. Kasnije su ga ljudi zvali jezero sa ribama. Danas
        na njegovoj površini plutaju beli cvetovi, a po sredini se bez brige kupaju tri
        dečaka. Oko njih stoje čuvari koji u bajkama čekaju poljubac da bi postali
        prinčevi. Ali ovde ih niko nije poljubio, pa ostaju na svojim mestima. Nađi jezero,
        dobro pogledaj figure u sredini i prebroj one koji čuvaju dečake. Taj broj je ključ
        tvog sledećeg koraka.
    accepted_answers: ["10", ten]
    hint1: >-
      Don't look for the big lake with the boats. Yours is smaller and older, and it takes
      its name from the flowers growing in its water.
    hint1_i18n:
      de: >-
        Such nicht nach dem großen See mit den Booten. Deiner ist kleiner und älter, und er
        trägt den Namen der Blumen, die in seinem Wasser wachsen.
      sr: >-
        Ne traži veliko jezero sa čamcima. Tvoje je manje i starije, a ime je dobilo po
        cveću koje raste u njegovoj vodi.
    hint2: >-
      If you spot a little honey-loving bear facing the water, you're in the right place.
      Look where he's looking.
    hint2_i18n:
      de: >-
        Wenn du einen kleinen honigliebenden Bären siehst, der aufs Wasser blickt, bist du
        am richtigen Ort. Schau dorthin, wohin er blickt.
      sr: >-
        Ako ugledaš malog medveda koji voli med a gleda u vodu, na pravom si mestu. Pogledaj
        tamo gde i on gleda.
    tourist_info: |
      The pond was laid out by Daniel Neff, the Swiss gardener who first designed Borisova
      Garden, on the site of a former marsh. He stocked it with goldfish and planted water
      lilies. Because of the goldfish, it was known for many years as the Fish Pond. As early
      as around 1900 the pond appeared on some of Sofia's very first postcards. At that time
      it was decorated with an ornamental vase spouting water and with figures of frogs and
      turtles.

      Over the years the pond's appearance changed many times. In 1935 a large stone lily
      with 36 jets of water was placed at its centre. Later, to a design by the sculptor
      Vasil Zidarov, it was replaced by three bathing children. The boys have had an eventful
      history. By 2011 they had disappeared, and only a few frogs remained of the decoration.
      After bronze replicas, restored with corporate sponsorship, were stolen again, the
      municipality had the figures made from painted plastic. Today the bathing boys are back
      in their place, and some of the lilies in South Park were transplanted from this very
      pond. A curious detail: the nearby drinking fountain was once topped with a bear, and
      nine penguins surrounded its spouts.
    tourist_info_i18n:
      de: |
        Den Teich legte Daniel Neff an, der Schweizer Gärtner, der als Erster den
        Borisova-Garten entwarf, an der Stelle eines ehemaligen Sumpfs. Er besetzte ihn mit
        Goldfischen und pflanzte Seerosen. Wegen der Goldfische war er über viele Jahre als
        Fischteich bekannt. Schon um 1900 erschien der Teich auf einigen der allerersten
        Postkarten Sofias. Damals war er mit einer Ziervase mit Wasserspeier sowie mit
        Figuren von Fröschen und Schildkröten geschmückt.

        Im Laufe der Jahre veränderte der Teich sein Aussehen viele Male. 1935 wurde in
        seiner Mitte eine große steinerne Seerose mit 36 Wasserstrahlen aufgestellt. Später
        wurde sie nach einem Entwurf des Bildhauers Vasil Zidarov durch drei badende Kinder
        ersetzt. Die Jungen haben eine wechselvolle Geschichte. Bis 2011 waren sie
        verschwunden, und von der Dekoration blieben nur ein paar Frösche. Nachdem
        Bronzekopien, mit Firmenspenden restauriert, erneut gestohlen worden waren, ließ die
        Gemeinde die Figuren aus bemaltem Kunststoff anfertigen. Heute sind die badenden
        Jungen wieder an ihrem Platz, und manche der Seerosen im Südpark wurden genau aus
        diesem Teich verpflanzt. Eine kuriose Einzelheit: Der nahe Trinkbrunnen war einst von
        einem Bären gekrönt, und neun Pinguine umgaben seine Wasserspeier.
      sr: |
        Jezero je uredio Danijel Nef, švajcarski baštovan koji je prvi projektovao Borisovu
        baštu, na mestu nekadašnje močvare. Nastanio je u njemu zlatne ribice i posadio
        lokvanje. Zbog zlatnih ribica mnogo godina bio je poznat kao jezero sa ribama. Već
        oko 1900. jezero se pojavilo na nekim od prvih sofijskih razglednica. Tada je bilo
        ukrašeno ukrasnom vazom sa vodometom i figurama žaba i kornjača.

        Kroz godine izgled jezera menjao se više puta. Godine 1935. u njegovom središtu
        postavljen je veliki kameni lokvanj sa 36 vodenih mlazeva. Kasnije je, po projektu
        vajara Vasila Zidarova, zamenjen trima dečacima koji se kupaju. Dečaci su imali burnu
        istoriju. Do 2011. su nestali, a od dekoracije je ostalo samo nekoliko žaba. Kada su
        bronzane kopije, obnovljene uz pomoć firmi, ponovo ukradene, gradska uprava je
        naručila figure od farbane plastike. Danas su se kupajući dečaci vratili na svoje
        mesto, a neki lokvanji u Južnom parku presađeni su upravo sa ovog jezera. Zanimljiv
        detalj: obližnja česma za piće nekada je bila okrunjena medvedom, a devet pingvina
        okruživalo je njene vodomete.
  - id: eagles-bridge
    name: Eagles' Bridge
    name_i18n: { de: Adlerbrücke, sr: Orlov most }
    task: >-
      More than a century ago, travellers arriving from Constantinople knew that once they
      crossed this small river, they had reached the capital. This is where the city welcomed
      its guests. One spring in March, it also welcomed those returning from distant exile.
      Today this gate has no wings, but its guards do. Find the gate and search its railings
      for the year it was first opened. That year is the key to your next step.
    task_i18n:
      de: >-
        Vor mehr als einem Jahrhundert wussten die Reisenden, die aus Konstantinopel kamen:
        Sobald sie diesen kleinen Fluss überquert hatten, hatten sie die Hauptstadt erreicht.
        Hier begrüßte die Stadt ihre Gäste. An einem Frühling im März begrüßte sie hier auch
        jene, die aus der Verbannung in die Heimat zurückkehrten. Heute hat dieses Tor keine
        Flügel, aber seine Wächter haben welche. Finde das Tor und suche auf seinem Geländer
        das Jahr, in dem es zum ersten Mal eröffnet wurde. Dieses Jahr ist der Schlüssel zu
        deinem nächsten Schritt.
      sr: >-
        Pre više od jednog veka putnici koji su dolazili iz Carigrada znali su da su, čim
        pređu ovu malu reku, stigli u prestonicu. Tu ih je grad dočekivao kao svoje goste.
        Prolećnog martovskog dana tu je dočekivao i one koji su se vraćali iz dalekog
        zatočeništva. Danas ova kapija nema krila, ali njegovi čuvari imaju. Nađi kapiju i
        potraži na njenim gelenderima godinu kada je prvi put otvorena. Ta godina je ključ
        tvog sledećeg koraka.
    accepted_answers: ["1891"]
    hint1: >-
      The road the guests travelled on still bears the name of the city they came from.
      Follow it towards the centre.
    hint1_i18n:
      de: >-
        Die Straße, auf der die Gäste reisten, trägt noch immer den Namen der Stadt, aus der
        sie kamen. Folge ihr ins Zentrum.
      sr: >-
        Put kojim su dolazili gosti i danas nosi ime grada iz koga su dolazili. Prati ga ka
        centru.
    hint2: >-
      The gate is named after the birds that guard it from above. Stand between them, look
      down towards the river and read what is written in the metal.
    hint2_i18n:
      de: >-
        Das Tor ist nach den Vögeln benannt, die es von oben bewachen. Stelle dich zwischen
        sie, blicke zum Fluss hinunter und lies, was im Metall geschrieben steht.
      sr: >-
        Kapija je dobila ime po pticama koje je čuvaju s visine. Stani između njih, pogledaj
        naniže ka reki i pročitaj šta piše u metalu.
    tourist_info: |
      Eagles' Bridge (Orlov Most) was built in 1890–1891 over the Perlovska River and was one
      of the first solid masonry bridges erected in Sofia after the Liberation. For travellers
      entering the city from the east along Tsarigradsko Shose, it was the first crossroads
      leading into the centre proper, which is why it is called the city's gateway. The
      location was no accident. In March 1878, the Bulgarian prisoners and exiles freed from
      Diyarbakır were welcomed home on this very spot. For this reason, the bridge was
      conceived as a symbol of freedom. Today the event is marked by a modest stone plaque
      placed by the municipality in the 1990s.

      The bridge was designed by Sofia's chief architect, Adolf Václav Kolář, together with
      the Czech engineer Václav Prošek, while its construction was entrusted to his cousins
      Jiří and Bohdan Prošek. The same builders also erected Lions' Bridge, and Eagles' Bridge
      was completed two years after it. The eagles and the metal parts were made in Vienna by
      the firm Rudolph Philipp Waagner & Biró. The four bronze eagles with outstretched wings
      perch on columns of dressed granite about 7 metres high. According to interpreters,
      their number symbolises the four cardinal directions. The year of completion is
      inscribed on the richly decorated railings on both sides of the bridge. In 1970 the
      bridge was widened, and its northern railing was moved.
    tourist_info_i18n:
      de: |
        Die Adlerbrücke (Orlov Most) wurde 1890–1891 über die Perlovska errichtet und war
        eine der ersten massiven Steinbrücken, die in Sofia nach der Befreiung gebaut wurden.
        Für Reisende, die von Osten über die Tsarigradsko Schosse in die Stadt kamen, war sie
        die erste Kreuzung Richtung eigentlichem Zentrum – deshalb nennt man sie das Tor der
        Stadt. Der Standort war kein Zufall. Im März 1878 wurden an genau dieser Stelle die
        bulgarischen Gefangenen und Verbannten, die aus Diyarbakır befreit worden waren, in
        der Heimat willkommen geheißen. Deshalb wurde die Brücke als Symbol der Freiheit
        konzipiert. Heute erinnert eine bescheidene Steintafel, die die Gemeinde in den
        1990er Jahren anbrachte, an dieses Ereignis.

        Entworfen wurde die Brücke von Sofias Chefarchitekt Adolf Václav Kolář zusammen mit
        dem tschechischen Ingenieur Václav Prošek; den Bau übertrug man seinen Vettern Jiří
        und Bohdan Prošek. Dieselben Baumeister errichteten auch die Löwenbrücke, und die
        Adlerbrücke wurde zwei Jahre nach ihr vollendet. Die Adler und die Metallteile
        fertigte in Wien die Firma Rudolph Philipp Waagner & Biró. Die vier bronzegen Adler
        mit ausgebreiteten Flügeln sitzen auf Granitsäulen von etwa 7 Metern Höhe. Deutern
        zufolge symbolisiert ihre Zahl die vier Himmelsrichtungen. Das Jahr der Fertigstellung
        ist auf den reich verzierten Geländern an beiden Seiten der Brücke eingraviert. 1970
        wurde die Brücke verbreitert, und ihr nördliches Geländer wurde versetzt.
      sr: |
        Orlov most sagrađen je 1890–1891. preko reke Perlovske i bio je jedan od prvih
        čvrstih kamenih mostova podignutih u Sofiji posle oslobođenja. Za putnike koji su u
        grad ulazili s istoka, Carigradskim drumom, to je bila prva raskrsnica ka samom
        centru — zato ga zovu kapija grada. Lokacija nije bila slučajna. U martu 1878. upravo
        na ovom mestu dočekani su u otadžbini bugarski zarobljenici i zatočenici oslobođeni
        iz Dijarbakira. Zato je most zamišljen kao simbol slobode. Danas taj događaj obeležava
        skromna kamena ploča koju je gradska uprava postavila devedesetih godina prošlog
        veka.

        Most su projektovali sofijski glavni arhitekta Adolf Vaclav Kolar sa češkim
        inženjerom Vaclavom Prošekom, a gradnja je poverena njegovim rođacima Jiržiju i
        Bohdanu Prošeku. Isti graditelji podigli su i Lavov most, a Orlov most je završen dve
        godine posle njega. Orlovi i metalni delovi rađeni su u Beču, u firmi Rudolf Filip
        Vagner i Biro. Četiri bronzana orla raširenih krila sede na stubovima od obrađenog
        granita visokim oko 7 metara. Po tumačenjima, njihov broj simbolizuje četiri strane
        sveta. Godina završetka uklesana je na bogato ukrašenim gelenderima sa obe strane
        mosta. Godine 1970. most je proširen, a njegov severni gelender je pomeran.
  - id: sofia-university
    name: Sofia University (Rectorate)
    name_i18n: { de: Sofia-Universität (Rektorat), sr: Sofijski univerzitet (Rektorat) }
    task: >-
      Two brothers from Karlovo turned a modest trade in a foreign land into a banking
      empire, and to this day they remain an example of successful entrepreneurship. Yet
      their generosity proved more valuable than their wealth. They supported churches,
      schools and hospitals, and in the end left almost their entire fortune to their
      homeland. They had no children, but they left Bulgaria an heir that welcomes thousands
      of new "children" every year. Now the brothers sit on either side of the steps, watching
      who comes in. Stand between them and count how many doors lead to knowledge.
    task_i18n:
      de: >-
        Zwei Brüder aus Karlovo machten aus einem bescheidenen Handel in der Fremde ein
        Bankimperium, und bis heute gelten sie als Beispiel für erfolgreiche Unternehmer.
        Doch ihre Großzügigkeit erwies sich als wertvoller als ihr Reichtum. Sie unterstützten
        Kirchen, Schulen und Krankenhäuser und hinterließen am Ende fast ihr gesamtes
        Vermögen ihrer Heimat. Sie hatten keine Kinder, aber sie hinterließen Bulgarien einen
        Erben, der jedes Jahr Tausende neuer „Kinder" willkommen heißt. Nun sitzen die Brüder
        zu beiden Seiten der Treppe und beobachten, wer hereinkommt. Stell dich zwischen sie
        und zähle, wie viele Türen zum Wissen führen.
      sr: >-
        Dva brata iz Karlova pretvorila su skromnu trgovinu u tuđini u bankarsko carstvo, i
        danas su primer uspešnog preduzetništva. Ali njihova velikodušnost pokazala se
        vrednijom od bogatstva. Pomažali su crkve, škole i bolnice, a na kraju su skoro celo
        bogatstvo ostavili otadžbini. Nisu imali decu, ali su Bugarskoj ostavili naslednika
        koji svake godine dočekuje hiljade novih „dece". Sada braća sede sa obe strane
        stepenica i posmatraju ko ulazi. Stani između njih i prebroj koliko vrata vode ka
        znanju.
    accepted_answers: ["3", three]
    hint1: >-
      The brothers' heir is the oldest institution of higher education in the country.
      Beneath it lies a metro station that bears its name.
    hint1_i18n:
      de: >-
        Der Erbe der Brüder ist die älteste Hochschule des Landes. Unter ihr liegt eine
        Metrostation, die ihren Namen trägt.
      sr: >-
        Naslednik braće je najstarija visokoškolska ustanova u zemlji. Ispod nje se nalazi
        metro stanica koja nosi njeno ime.
    hint2: >-
      The brothers are cast in bronze and sit on either side of the grand staircase. Count
      only the doors it leads to.
    hint2_i18n:
      de: >-
        Die Brüder sind in Bronze gegossen und sitzen zu beiden Seiten der großen Treppe.
        Zähle nur die Türen, zu denen sie führt.
      sr: >-
        Braća su livljeni u bronzi i sede sa obe strane velikog stepeništa. Prebroj samo
        vrata do kojih ono vodi.
    tourist_info: |
      Evlogi and Hristo Georgiev were born in Karlovo. As young men they joined their
      maternal uncles, the Puliev family, who were merchants in Romania. There the brothers
      built up a large trading and banking business, while also supporting many institutions
      and paying for the education of numerous young people. In 1896 Evlogi donated 800,000
      gold leva and a plot of land in central Sofia for the building of the future university.
      He died a year later. In his will he left 6 million leva for a higher school in Bulgaria
      and also acknowledged the contribution of his brother Hristo, who had died back in 1872
      at just 48. His relatives expected a large inheritance, but Evlogi left them only a few
      thousand leva and gave almost everything else to churches, schools, hospitals and
      universities. The two brothers are buried in Bellu Cemetery in Bucharest, and their tomb
      has been declared an architectural monument by the Romanian state.

      The road to the building was not an easy one. In 1906 an international design
      competition was won by the French architect Henri Bréasson, but construction never
      began. Later, the board managing the donation commissioned the architect Yordan Milanov
      to rework the design, despite objections from the university and from Bréasson himself.
      The foundation stone was laid on 30 June 1924, and the building was solemnly consecrated
      on 16 December 1934. Evlogi had asked for two marble statues to be erected in the
      school's courtyard in memory of the brothers. Today they stand before the university's
      doors, but they were cast in bronze. The two seated figures are the work of the sculptor
      Kiril Shivarov.
    tourist_info_i18n:
      de: |
        Evlogi und Christo Georgiew wurden in Karlovo geboren. Als junge Männer schlossen sie
        sich den Brüdern ihrer Mutter an, der Familie Puliev, die in Rumänien Kaufleute waren.
        Dort bauten die Brüder ein großes Handels- und Bankgeschäft auf und unterstützten
        zugleich viele Institutionen und bezahlten die Ausbildung zahlreicher junger Menschen.
        1896 stiftete Evlogi 800.000 Goldlewa und ein Grundstück im Zentrum Sofias für den Bau
        der künftigen Universität. Ein Jahr später starb er. In seinem Testament vermachte er
        6 Millionen Lewa für eine Hochschule in Bulgarien und würdigte auch den Anteil seines
        Bruders Christo, der bereits 1872 im Alter von nur 48 Jahren gestorben war. Seine
        Verwandten erwarteten eine große Erbschaft, doch Evlogi hinterließ ihnen nur ein paar
        Tausend Lewa und gab fast alles Übrige den Kirchen, Schulen, Krankenhäusern und
        Universitäten. Die beiden Brüder sind auf dem Bellu-Friedhof in Bukarest begraben, und
        ihr Grab wurde vom rumänischen Staat zum Architekturdenkmal erklärt.

        Der Weg zum Gebäude war nicht leicht. 1906 gewann der französische Architekt Henri
        Bréasson einen internationalen Entwurfswettbewerb, doch der Bau begann nie. Später
        beauftragte der Stiftungsrat den Architekten Yordan Milanov, den Entwurf zu
        überarbeiten – trotz Einsprüchen der Universität und Bréassons selbst. Der Grundstein
        wurde am 30. Juni 1924 gelegt, und das Gebäude wurde am 16. Dezember 1934 feierlich
        geweiht. Evlogi hatte gewünscht, dass im Hof der Schule zwei Marmorstatuen zum Gedenken
        an die Brüder errichtet werden. Heute stehen sie vor den Türen der Universität, aber
        sie wurden in Bronze gegossen. Die zwei sitzenden Figuren sind das Werk des Bildhauers
        Kiril Shivarov.
      sr: |
        Evlogi i Hristo Georgijev rođeni su u Karlovu. Kao mladići pridružili su se ujacima sa
        majčine strane, porodici Pulijev, trgovcima u Rumuniji. Tamo su braća izgradila veliku
        trgovačku i bankarsku delatnost, a uz to pomažali su mnogim ustanovama i plaćali su
        školovanje brojnim mladim ljudima. Godine 1896. Evlogi je poklonio 800.000 zlatnih leva
        i plac u središtu Sofije za podizanje budućeg univerziteta. Godinu dana kasnije umro
        je. U oporuci je ostavio 6 miliona leva za visoku školu u Bugarskoj i priznao je i
        zasluge brata Hrista, koji je umro još 1872. u svojoj 48. godini. Rođaci su očekivali
        veliku baštinu, ali im je Evlogi ostavio samo nekoliko hiljada leva, a skoro sve
        ostalo poklonio je crkvama, školama, bolnicama i univerzitetima. Braća su sahranjena na
        groblju Belju u Bukureštu, a njihovu grobnicu rumunska država proglasila je spomenikom
        arhitekture.

        Put do zgrade nije bio lak. Godine 1906. na međunarodnom konkursu pobedio je francuski
        arhitekta Anri Breason, ali gradnja nikada nije počela. Kasnije je odbor koji je
        upravljao zadužbinom poverio arhitekti Jordanu Milanovu da prerađuje projekat, uprkos
        primedbama univerziteta i samog Breasona. Temeljni kamen položen je 30. juna 1924, a
        zgrada je svečano osvećena 16. decembra 1934. Evlogi je tražio da se u dvorištu škole
        podignu dve mermorne statue u spomen braći. Danas stoje pred vratima univerziteta, ali
        su liveni u bronzi. Dve sede figure delo su vajara Kirila Šivarova.
  - id: alexander-nevsky
    name: Alexander Nevsky Cathedral
    name_i18n: { de: Alexander-Newski-Kathedrale, sr: Katedrala Sv. Aleksandra Nevskog }
    task: >-
      This church is a gesture of gratitude to the thousands of soldiers who came from afar
      to bring freedom. It bears the name of a warrior prince from the north who became the
      patron of their army. The prince watches over the church from high up on the façade,
      right above three windows. But someone is watching him too. Nearby, before the grave of
      a soldier whose name no one knows, lies a guard who never blinks. He is a symbol of this
      land and has guarded the fire beside him for almost a century. Find out on which side
      the prince's icon is and who gazes at it from afar. The guard is the key to your next
      step.
    task_i18n:
      de: >-
        Diese Kirche ist eine Geste der Dankbarkeit an die Tausenden Soldaten, die von fern
        kamen, um Freiheit zu bringen. Sie trägt den Namen eines Kriegerfürsten aus dem
        Norden, der zum Schutzpatron ihrer Armee wurde. Der Fürst wacht hoch oben an der
        Fassade über die Kirche, genau über drei Fenstern. Doch auch jemand beobachtet ihn.
        In der Nähe, vor dem Grab eines Soldaten, dessen Name niemand kennt, liegt ein
        Wächter, der nie blinzelt. Er ist ein Symbol dieses Landes und hütet seit beinahe
        einem Jahrhundert das Feuer neben sich. Finde heraus, auf welcher Seite die Ikone des
        Fürsten ist und wer aus der Ferne auf sie blickt. Der Wächter ist der Schlüssel zu
        deinem nächsten Schritt.
      sr: >-
        Ova crkva je znak zahvalnosti hiljadama vojnika koji su došli izdaleka da donesu
        slobodu. Ime nosi po ratničkom knezu sa severa koji je postao zaštitnik njihove
        armije. Knez bdije nad crkvom visoko na fasadi, baš iznad tri prozora. Ali i neko
        gleda njega. U blizini, pred grobom vojnika čije ime niko ne zna, leži stražar koji
        nikad ne trepne. On je simbol ove zemlje i skoro jedan vek čuva vatru pored sebe.
        Saznaj sa koje strane je ikona kneza i ko je izdaleka gleda. Stražar je ključ tvog
        sledećeg koraka.
    accepted_answers: [lion, the lion]
    hint1: >-
      The prince's icon is on the side where the bell tower rises, facing the direction where
      the sun sets.
    hint1_i18n:
      de: >-
        Die Ikone des Fürsten ist auf der Seite, auf der sich der Glockenturm erhebt, in
        Richtung des Sonnenuntergangs.
      sr: >-
        Ikona kneza je na strani gde se uzdiže zvonik, okrenuta ka strani gde sunce zalazi.
    hint2: >-
      Stand with your back to the icon and walk towards the oldest church, the one that gave
      the city its name. Beside its eternal flame you will find the guard.
    hint2_i18n:
      de: >-
        Stell dich mit dem Rücken zur Ikone und gehe zur ältesten Kirche, derjenigen, die der
        Stadt ihren Namen gab. Neben ihrem ewigen Feuer findest du den Wächter.
      sr: >-
        Stani leđima okrenut ikoni i pođi ka najstarijoj crkvi, onoj koja je dala ime gradu.
        Pored njenog večnog ognja naći ćeš stražara.
    tourist_info: |
      The St. Alexander Nevsky Cathedral was built in gratitude to the Russian liberators and
      bears the name of St. Alexander Nevsky, patron of the Russian army in the Russo-Turkish
      War. The foundation stone was laid in 1882, and construction to a design by the
      architect Alexander Pomerantsev lasted from 1904 to 1912. The mosaic icon of the saint
      is on the western façade, above the triple window, 30 metres above the ground.

      The lion that gazes towards it is part of the Monument to the Unknown Soldier beside the
      St. Sofia Church. It is the work of the sculptor Andrey Nikolov, who spent five years on
      it, from 1926 to 1931. The first monument, however, was rejected because it was
      overloaded with 17 sculpted figures. It was finally unveiled in 1941, and during the
      bombing of 1944 it was almost destroyed. For many years the lion moved from place to
      place and was eventually found in the courtyard of a villa near Vrana. It was returned
      to its original spot when the new monument opened in 1981. Beside it burns an eternal
      flame, together with soil from Shipka and Stara Zagora, where the heaviest losses of the
      Liberation War were suffered. Today the four-metre bronze lion is polished smooth by the
      children who climb on it.
    tourist_info_i18n:
      de: |
        Die Kathedrale St. Alexander Newski wurde in Dankbarkeit gegenüber den russischen
        Befreiern erbaut und trägt den Namen des heiligen Alexander Newski, des Schutzpatrons
        der russischen Armee im Russisch-Türkischen Krieg. Der Grundstein wurde 1882 gelegt,
        und der Bau nach dem Entwurf des Architekten Alexander Pomeranzew dauerte von 1904 bis
        1912. Das Mosaikbild des Heiligen befindet sich an der Westfassade, über dem
        dreifach gegliederten Fenster, 30 Meter über dem Boden.

        Der Löwe, der zu ihm hinaufblickt, gehört zum Denkmal des unbekannten Soldaten neben
        der Kirche St. Sofia. Es ist das Werk des Bildhauers Andrej Nikolow, der fünf Jahre an
        ihm arbeitete, von 1926 bis 1931. Das erste Denkmal wurde jedoch abgelehnt, weil es
        mit 17 Skulpturfiguren überladen war. Schließlich wurde es 1941 enthüllt, und bei den
        Bombardierungen 1944 wurde es beinahe zerstört. Viele Jahre wanderte der Löwe von Ort
        zu Ort und wurde schließlich im Hof einer Villa nahe Vrana gefunden. Er kehrte an
        seinen ursprünglichen Platz zurück, als das neue Denkmal 1981 eingeweiht wurde. Daneben
        brennt ein ewiges Feuer, zusammen mit Erde von Schipka und Stara Sagora, wo die
        schwersten Verluste des Befreiungskrieges zu beklagen waren. Heute ist der vier Meter
        hohe Bronzelöwe von den Kindern, die auf ihm klettern, glatt poliert.
      sr: |
        Katedrala Sv. Aleksandra Nevskog sagrađena je u znak zahvalnosti ruskim oslobodiocima
        i nosi ime Sv. Aleksandra Nevskog, zaštitnika ruske armije u rusko-turskom ratu.
        Temeljni kamen položen je 1882, a gradnja po projektu arhitekte Aleksandra
        Pomeranceva trajala je od 1904. do 1912. Mozaik ikone sveca nalazi se na zapadnoj
        fasadi, iznad trostrukog prozora, 30 metara nad zemljom.

        Lav koji gleda u nju deo je Spomenika nepoznatom vojniku pored crkve Sv. Sofia. Delo
        je vajara Andreja Nikolova, koji je na njemu radio pet godina, od 1926. do 1931. Prvi
        spomenik je, međutim, odbijen jer je bio pretrpan sa 17 skulptura. Konačno je otkriven
        1941, a tokom bombardovanja 1944. bio je na ivici uništenja. Mnogo godina lav je
        seljen s mesta na mesto i na kraju je pronađen u dvorištu vile kod Vrane. Vraćen je na
        prvobitno mesto kada je 1981. otvoren novi spomenik. Pored njega gori večni oganj,
        zajedno sa zemljom sa Šipke i Stare Zagore, gde su u oslobođenačkom ratu bili najteži
        gubici. Danas je bronzani lav visok četiri metra uglačan do glatkoće od dece koja se
        penju po njemu.
    tourist_info_picture: images/landmark-nevsky.svg
  - id: ivan-vazov-theatre
    name: Ivan Vazov National Theatre
    name_i18n: { de: Nationales Theater Ivan Vazov, sr: Narodno pozorište Ivan Vazov }
    coordinates: { lat: 42.694466839258304, lon: 23.326135921777293 }
    task: >-
      In this building people cry and laugh, even though nothing sad or funny has happened in
      their lives. Once it burned almost to the ground, but its face survived, as if it
      refused to leave the stage. Six columns hold up its roof, and high above, the god of
      the arts is surrounded by his muses. Don't look at him. Step under the portico and
      raise your eyes above the doors. Women in white and gold sit there, and some of them
      hold other people's faces in their hands, some laughing, some weeping. Count only the
      faces in the hands of the women above the doors. The faces peering down from the top of
      the portico are not part of this game. Their number is the key to your next step.
    task_i18n:
      de: >-
        In diesem Gebäude weinen und lachen die Menschen, obwohl in ihrem Leben nichts
        Trauriges oder Lustiges passiert ist. Einst brannte es fast bis auf die Grundmauern
        nieder, aber sein Gesicht überlebte, als ob es sich weigerte, die Bühne zu verlassen.
        Sechs Säulen tragen sein Dach, und hoch oben ist der Gott der Künste von seinen Musen
        umgeben. Schau ihn nicht an. Tritt unter den Portikus und heb deine Augen über die
        Türen. Frauen in Weiß und Gold sitzen dort, und einige halten die Gesichter anderer
        Menschen in den Händen – manche lachend, manche weinend. Zähle nur die Gesichter in
        den Händen der Frauen über den Türen. Die Gesichter, die von der Spitze des Portikus
        herabblicken, gehören nicht zu diesem Spiel. Ihre Zahl ist der Schlüssel zu deinem
        nächsten Schritt.
      sr: >-
        U ovoj zgradi ljudi plaču i smeju se, iako im se u životu nije desilo ništa tužno ni
        smešno. Jednom je izgorela do temelja, ali je njen lik preživeo, kao da se neće
        odvojiti od scene. Šest stubova drži njen krov, a visoko gore bog umetnosti okružen
        je svojim muzama. Ne gledaj njega. Zakorači ispod portika i podigni pogled iznad
        vrata. Tamo sede žene u belom i zlatnom, a neke u rukama drže tuđa lica — neka se
        smeju, neka plaču. Prebroj samo lica koja žene iznad vrata drže u rukama. Lica koja
        se smiju s vrha portika nisu deo ove igre. Njihov broj je ključ tvog sledećeg koraka.
    accepted_answers: ["4", four]
    hint1: >-
      The building bears the name of the patriarch of Bulgarian literature, and the City
      Garden stretches out in front of it.
    hint1_i18n:
      de: >-
        Das Gebäude trägt den Namen des Patriarchen der bulgarischen Literatur, und vor ihm
        erstreckt sich der Stadtgarten.
      sr: >-
        Zgrada nosi ime patrijarha bugarske književnosti, a pred njom se prostire Gradski
        park.
    hint2: >-
      Not all of the women above the doors hold faces. Some hold lyres, so skip those. Count
      only the masks of comedy and tragedy that the women hold in their hands.
    hint2_i18n:
      de: >-
        Nicht alle Frauen über den Türen halten Gesichter. Manche halten Leiern – überspringe
        diese. Zähle nur die Masken der Komödie und der Tragödie, die die Frauen in den Händen
        halten.
      sr: >-
        Ne sve žene iznad vrata drže lica. Neke drže liru, pa njih preskoči. Prebroj samo
        maske komedije i tragedije koje žene drže u rukama.
    tourist_info: |
      The building was designed by the Viennese architects Ferdinand Fellner and Hermann
      Helmer, known as "the opera architects" because they built more than 50 theatres across
      Europe. It stands on the site of the wooden Osnova Theatre, and the National Assembly
      passed a special law to raise funds for its construction. The theatre opened on 3
      January 1907 with Ivan Vazov's play The Lost Ones. The opening was a stormy one:
      students booed Prince Ferdinand on his arrival, and he closed Sofia University for six
      months in response. Above the entrance, six columns support a triangular pediment
      showing Apollo, the patron of the arts, surrounded by the muses.

      Within just a few days in 1923, the building went through two ordeals. On 4 February,
      during a performance, a bomb was thrown at Prime Minister Aleksandar Stamboliyski, but
      no one was killed and the show went on. A week later, on 10 February, during an
      anniversary performance using gas lighting, a lamp set fire to the wooden parts of the
      stage. The blaze destroyed almost the entire building, and only the façade survived. The
      theatre was rebuilt by the German architect Martin Dülfer and the Bulgarian engineer
      Kiril Chaparov, and the new stage had a movable floor, a revolutionary technology for
      its time. The building was damaged again by bombing during the Second World War, and in
      1974–1976 its original appearance was restored.
    tourist_info_i18n:
      de: |
        Das Gebäude entwarfen die Wiener Architekten Ferdinand Fellner und Hermann Helmer,
        bekannt als „die Opernarchitekten", weil sie mehr als 50 Theater in ganz Europa
        bauten. Es steht an der Stelle des hölzernen Theaters Osnova, und die
        Nationalversammlung erließ ein Sondergesetz, um Gelder für seinen Bau zu sammeln.
        Eröffnet wurde das Theater am 3. Januar 1907 mit Ivan Vazovs Stück „Die Verlorenen".
        Die Eröffnung verlief stürmisch: Studenten buhten Fürst Ferdinand bei seiner Ankunft
        aus, und dieser schloss als Reaktion die Sofia-Universität für sechs Monate. Über dem
        Eingang tragen sechs Säulen einen dreieckigen Giebel, der Apollon, den Schutzpatron der
        Künste, zeigt, umgeben von den Musen.

        Innerhalb von nur wenigen Tagen im Jahr 1923 erlebte das Gebäude zwei Prüfungen. Am
        4. Februar wurde während einer Vorstellung ein Sprengsatz auf Ministerpräsident
        Aleksandar Stamboliyski geworfen, doch niemand kam ums Leben und die Vorstellung ging
        weiter. Eine Woche später, am 10. Februar, setzte während einer Jubiläumsvorstellung
        mit Gasbeleuchtung eine Lampe die hölzernen Teile der Bühne in Brand. Das Feuer
        zerstörte fast das gesamte Gebäude; nur die Fassade überlebte. Das Theater wurde vom
        deutschen Architekten Martin Dülfer und dem bulgarischen Ingenieur Kiril Chaparov
        wiederaufgebaut, und die neue Bühne erhielt einen beweglichen Boden, eine
        revolutionäre Technik ihrer Zeit. Im Zweiten Weltkrieg wurde das Gebäude erneut durch
        Bomben beschädigt, und 1974–1976 stellte man sein ursprüngliches Aussehen wieder her.
      sr: |
        Zgradu su projektovali bečki arhitekti Ferdinand Felner i Herman Helmer, poznati kao
        „arhitekti opera", jer su sagradili više od 50 pozorišta širom Evrope. Ona stoji na
        mestu drvenog pozorišta Osnova, a Narodna skupština donela je poseban zakon da prikupi
        sredstva za njenu gradnju. Pozorište je otvoreno 3. januara 1907. Vazovljevom dramom
        „Izgubljeni". Otvorenje je bilo burno: studenti su zviždali kneza Ferdinanda pri
        dolasku, a on je, kao odgovor, zatvorio Sofijski univerzitet na šest meseci. Iznad
        ulaza šest stubova nosi trougaoni zabat na kome je Apolon, zaštitnik umetnosti,
        okružen muzama.

        U svega nekoliko dana 1923. zgrada je prošla kroz dva iskušenja. 4. februara, tokom
        predstave, na premijera Aleksandara Stambolijskog bačena je bomba, ali niko nije
        stradao i predstava je nastavljena. Nedelju dana kasnije, 10. februara, tokom
        svečane predstave sa gasnim osvetljenjem lampa je zapalila drvene delove bine. Plamen
        je uništio skoro celu zgradu; preživela je samo fasada. Pozorište su obnovili nemački
        arhitekta Martin Dilfer i bugarski inženjer Kiril Čaparov, a nova bina je imala
        pokretni pod, revolucionarnu tehnologiju za ono vreme. Zgrada je ponovo oštećena
        bombardovanjem u Drugom svetskom ratu, a 1974–1976. obnovljen je njen prvobitni
        izgled.
  - id: ancient-serdika
    name: Ancient Serdika Complex
    name_i18n: { de: Antikes Serdika, sr: Antička Serdika }
    task: >-
      Above your heads flows today's Sofia: cars, trams, people in a hurry. But a few metres
      beneath their feet lies another city, whose streets were once walked by Roman soldiers
      and merchants. One of those streets ran straight from north to south, like the needle
      of a compass. The Romans called it by a word meaning "axis" or "hinge", because the
      whole city turned around it. Go down to the ancient city, find the spot near the glass
      dome and look for the sign that keeps the memory of this street alive. Its name is the
      key to your next step.
    task_i18n:
      de: >-
        Über deinen Kopf fließt das heutige Sofia: Autos, Straßenbahnen, eilige Menschen.
        Doch ein paar Meter unter ihren Füßen liegt eine andere Stadt, deren Straßen einst
        römische Soldaten und Kaufleute bevölkerten. Eine jener Straßen lief schnurgerade von
        Norden nach Süden – wie die Nadel eines Kompass. Die Römer nannten sie mit einem Wort,
        das „Achse" oder „Scharnier" bedeutet, denn die ganze Stadt drehte sich um sie. Steig
        hinab in die antike Stadt, finde die Stelle nahe der Glaskuppel und suche nach dem
        Schild, das die Erinnerung an diese Straße wachhält. Sein Name ist der Schlüssel zu
        deinem nächsten Schritt.
      sr: >-
        Iznad tvoje glave teče današnja Sofija: automobili, tramvaji, ljudi u žurbi. Ali
        nekoliko metara ispod njihovih nogu leži drugi grad, čije su ulice nekad gazili rimski
        vojnici i trgovci. Jedna od tih ulica išla je pravo od severa ka jugu, kao igla
        kompasa. Rimljani su je zvali rečju koja znači „osovina" ili „šarka", jer se ceo grad
        okretao oko nje. Siđi u antički grad, nađi mesto blizu staklene kupole i potraži tablu
        koja čuva sećanje na tu ulicu. Njeno ime je ključ tvog sledećeg koraka.
    accepted_answers: [Cardo, Cardo Maximus]
    hint1: >-
      Don't look for the sign directly under the glass dome. It stands a little behind it,
      slightly to one side, tucked away behind a barrier rope.
    hint1_i18n:
      de: >-
        Suche das Schild nicht direkt unter der Glaskuppel. Es steht ein wenig dahinter,
        leicht zur Seite, versteckt hinter einem Absperrseil.
      sr: >-
        Ne traži tablu tačno ispod staklene kupole. Ona stoji malo iza nje, pomarena u
        stranu, skrivena iza bezbednosne trake.
    hint2: >-
      The street has a more famous sister that runs from east to west, called the Decumanus.
      Look for the one that crosses her path.
    hint2_i18n:
      de: >-
        Die Straße hat eine berühmtere Schwester, die von Osten nach Westen läuft und
        Decumanus heißt. Suche die eine, die ihren Weg kreuzt.
      sr: >-
        Ulica ima poznatiju sestru koja ide od istoka ka zapadu, zvanu Dekumanus. Traži onu
        koja preseca njen put.
    tourist_info: |
      The remains of the Roman city were uncovered between 2010 and 2012, during the
      construction of the Serdika 2 metro station. The discoveries include parts of the city's
      two main streets: the Cardo Maximus, which linked the northern and southern gates, and
      the Decumanus Maximus, which linked the eastern and western gates. The two met at a
      right angle, and the forum, the city's central square, stood at their crossing. The
      street on the sign is one of the secondary streets that formed the city's grid. It is 5
      metres wide, 10 metres of it have been excavated, and its paving dates from the 6th
      century. Beneath it, parts of the ancient water supply and sewage system are on display,
      proof that Serdica was a well-planned city.

      The complex was officially opened in 2016 after six years of work by around a hundred
      archaeologists and five architects. It covers 8,000 square metres and, at its opening,
      was presented as the largest open-air museum in the Balkans. Under the glass dome
      between the Presidency and the Council of Ministers, a stage has been set up with the
      ruins of Serdica as its backdrop. Near the entrance to the metro station there are also
      remains of an early Christian basilica from the 4th century.
    tourist_info_i18n:
      de: |
        Die Reste der römischen Stadt wurden zwischen 2010 und 2012 beim Bau der Metrostation
        Serdika 2 freigelegt. Zu den Entdeckungen gehören Teile der beiden Hauptstraßen der
        Stadt: der Cardo Maximus, der das Nord- und das Südtor verband, und der Decumanus
        Maximus, der das Ost- und das Westtor verband. Die beiden trafen sich im rechten
        Winkel, und das Forum, der zentrale Platz der Stadt, stand an ihrer Kreuzung. Die
        Straße auf dem Schild ist eine der Nebenstraßen, die das Raster der Stadt bildeten. Sie
        ist 5 Meter breit, 10 Meter davon sind ausgegraben, und ihr Pflaster stammt aus dem 6.
        Jahrhundert. Darunter sind Teile der antiken Wasserversorgung und Kanalisation zu
        sehen – ein Beweis dafür, dass Serdika eine gut geplante Stadt war.

        Der Komplex wurde 2016 offiziell eröffnet, nach sechs Jahren Arbeit von rund hundert
        Archäologen und fünf Architekten. Er umfasst 8.000 Quadratmeter und wurde bei seiner
        Eröffnung als das größte Freilichtmuseum auf dem Balkan vorgestellt. Unter der
        Glaskuppel zwischen der Präsidentschaft und dem Ministerrat wurde eine Bühne
        eingerichtet, mit den Ruinen Serdikas als Kulisse. Nahe dem Eingang zur Metrostation
        sind auch Reste einer frühchristlichen Basilika aus dem 4. Jahrhundert zu sehen.
      sr: |
        Ostaci rimskog grada otkriveni su između 2010. i 2012, tokom gradnje metro stanice
        Serdika 2. Među otkrićima su delovi dve glavne ulice grada: Cardo Maximus, koji je
        spajao severnu i južnu kapiju, i Decumanus Maximus, koji je spajao istočnu i zapadnu
        kapiju. Sekle su se pod pravim uglom, a na njihovom ukrštanju stajao je forum, glavni
        trg grada. Ulica na tabli jedna je od sporednih ulica koje su činile mrežu grada.
        Široka je 5 metara, iskopano je 10 metara, a njena kaldrma potiče iz 6. veka. Ispod
        nje su izloženi delovi drevnog vodovoda i kanalizacije — dokaz da je Serdika bilo
        dobro planiran grad.

        Kompleks je zvanično otvoren 2016. posle šest godina rada stotinak arheologa i pet
        arhitekata. Prostire se na 8.000 kvadratnih metara i pri otvorenju je predstavljen
        kao najveći muzej na otvorenom na Balkanu. Ispod staklene kupole između Predsedništva
        i Saveta ministara postavljena je bina sa ruševinama Serdike kao pozadinom. U blizini
        ulaza u metro stanicu nalaze se i ostaci ranohrišćanske bazilike iz 4. veka.
