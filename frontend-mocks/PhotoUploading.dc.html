<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo — uploading</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/questcity/components/bundle.css">
<link rel="stylesheet" href="quest-mocks.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="qs" style="width: 390px; height: 844px">
<header class="qc-header" aria-label="Game status" style="flex: none">
<div class="qc-header__top">
<span class="qc-header__clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>01:27:15</span>
<span class="qc-tag qc-tag--on-dark">+25 min</span>
</div>
<div class="qc-header__progress"><span>Task 3 of 8</span><div class="qc-progress" role="progressbar" aria-label="Quest progress" aria-valuenow="3" aria-valuemin="0" aria-valuemax="8"><span style="width: 37.5%"></span></div></div>
</header>
<main class="qs-main" style="padding-top: 24px">
<div class="qs-group" style="gap: 8px">
<p class="qs-eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Photo stop</p>
<h1 class="t-title">Take a photo of your team at Alexander Nevsky Cathedral.</h1>
<p class="t-body">Get everyone in the shot. You can add more than one photo.</p>
</div>
<div class="qc-photo" role="status"><div class="qc-photo__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></div><div class="qc-photo__text"><span class="qc-photo__title">Uploading 1 photo… 60%</span><div class="qc-photo__bar" role="progressbar" aria-label="Upload progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><span style="width: 60%"></span></div><span class="qc-photo__meta">Keep this screen open</span></div></div>
<div class="qs-note">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path></svg>
<p class="t-body">Photos go straight to your host for a surprise album, so you won't see them here.</p>
</div>
</main>
<div class="qs-actions">
<button class="qc-btn qc-btn--locked qc-btn--block" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Continue · waiting for upload</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
