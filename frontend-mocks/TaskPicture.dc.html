<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task — with picture</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/questcity/components/bundle.css">
<link rel="stylesheet" href="quest-mocks.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="qs" style="width: 390px; height: 844px">
<header class="qc-header" aria-label="Game status" style="flex: none">
<div class="qc-header__top">
<span class="qc-header__clock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>01:12:45</span>
<span class="qc-tag qc-tag--on-dark">+25 min</span>
</div>
<div class="qc-header__progress"><span>Task 3 of 8</span><div class="qc-progress" role="progressbar" aria-label="Quest progress" aria-valuenow="3" aria-valuemin="0" aria-valuemax="8"><span style="width: 37.5%"></span></div></div>
</header>
<main class="qs-main">
<img class="qs-pic" src="img/task-domes.svg" alt="Task picture: three golden domes against the sky">
<div class="qs-group" style="gap: 8px">
<p class="qs-eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M15 8l2 2"></path></svg>Riddle</p>
<p class="t-riddle">Golden domes shine over the square that bears my name. I was built to honour soldiers who fell for this land's freedom. Who am I?</p>
</div>
<div class="qs-group">
<div class="qs-group-head"><h2 class="t-label">Need help?</h2><p class="t-caption">Hints add time to your total.</p></div>
<button class="qc-hint-btn"><span>Hint 1</span><span class="qc-tag">+10 min</span></button>
<button class="qc-hint-btn" disabled><span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Hint 2</span><span style="font: 400 15px/20px var(--font-sans)">after hint 1 · +15 min</span></button>
<button class="qc-hint-btn" disabled style="padding-top: 8px; padding-bottom: 8px"><span style="display: grid; gap: 2px; text-align: left"><span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Reveal answer</span><span style="font: 400 15px/20px var(--font-sans)">Unlocks after 5 tries or 20 min</span></span><span style="font: 400 15px/20px var(--font-sans)">+30 min</span></button>
</div>
</main>
<div class="qs-actions">
<div class="qc-field"><label class="qc-field__label" for="answer">Your answer</label><input class="qc-input" id="answer" placeholder="Type the landmark's name" autocomplete="off"></div>
<button class="qc-btn qc-btn--primary qc-btn--block">Submit</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
